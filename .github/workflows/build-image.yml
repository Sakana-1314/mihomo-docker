name: 构建镜像

# 每天 02:00 UTC 拉取 Meta 分支内核代码构建并发布；版本号统一为 dev（每次先删除旧 tag 与 release）
# PR 与 main 推送只做校验，不发布；也可用 workflow_dispatch 手动发布
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sakana-1314/mihomo
  KERNEL_REF: Meta
  RELEASE_TAG: dev

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "以下文件未格式化："; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet -tags with_gvisor ./...

      - name: 单元测试
        run: go test -tags with_gvisor ./...

      - name: shellcheck（容器级测试脚本）
        run: |
          command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck -x -P SCRIPTDIR tests/*.sh

      - name: 面板脚本语法
        run: node --check internal/panel/static/app.js

  image:
    name: 镜像构建与发布
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 解析 Meta 分支内核版本
        id: kernel
        run: |
          go get "github.com/metacubex/mihomo@${KERNEL_REF}"
          go mod tidy
          version="$(go list -m -f '{{.Version}}' github.com/metacubex/mihomo)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "内核版本：${version}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建（本地验证用）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: local/gw:verify
          build-args: |
            MIHOMO_REF=${{ env.KERNEL_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试（订阅自动更新 / 快捷切换 / 流量统计 / 面板）
        env:
          IMAGE: local/gw:verify
        run: bash tests/smoke.sh

      - name: 透明代理链路测试（netns 真实转发）
        env:
          IMAGE: local/gw:verify
        run: bash tests/transparent-e2e.sh

      - name: 推送镜像（多架构，标签 dev 与 latest）
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE }}:latest
          build-args: |
            MIHOMO_REF=${{ env.KERNEL_REF }}
          cache-from: type=gha

      - name: 刷新 dev 标签与 Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
        run: |
          set -eu
          # 先删除旧的 tag 与 release，再以统一版本号 dev 重建
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag || true
          git tag -f "${RELEASE_TAG}"
          git push -f origin "refs/tags/${RELEASE_TAG}"
          cat > /tmp/release-notes.md <<EOF
          - 镜像：\`${IMAGE}:${RELEASE_TAG}\`（同时更新 \`latest\`）
          - 平台：linux/amd64、linux/arm64
          - 内核：Meta 分支 \`${KERNEL_VERSION}\`
          - 网关：\`${GITHUB_SHA}\`
          - 构建：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file /tmp/release-notes.md

      - name: 校验推送结果
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}"
