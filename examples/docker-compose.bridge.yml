services:
  mihomo-docker:
    image: ghcr.io/sakana-1314/mihomo-docker:latest
    container_name: mihomo-docker
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      TRANSPARENT_MODE: "off"
      SECRET: "change-me"
    ports:
      - "7890:7890"
      - "7892:7892"
      - "7893:7893"
      - "8080:8080"
      - "9090:9090"
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./data:/data
