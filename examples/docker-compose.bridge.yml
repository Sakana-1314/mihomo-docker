# =============================================================================
# 米哈游 API 加速网关 · 普通网桥部署示例（非透明网关用法）
#
# 适合：先验证功能、或仅需要通过端口接入的场景（不接管局域网转发）。
# 启动：docker compose -f examples/docker-compose.bridge.yml up -d
# 访问：管理面板 http://<宿主机IP>:8080/ ；完整面板 http://<宿主机IP>:9090/ui/
# =============================================================================

services:
  mihomo-docker:
    image: ghcr.io/sakana-1314/mihomo-docker:latest
    container_name: mihomo-docker
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      TRANSPARENT_MODE: "off"
      SECRET: "change-me"
    ports:
      - "7890:7890" # 混合端口（HTTP / SOCKS5）
      - "7892:7892" # 透明端口（REDIRECT，TCP）
      - "7893:7893" # 透明端口（TPROXY，TCP + UDP）
      - "8080:8080" # 管理面板
      - "9090:9090" # 内核 API 与完整面板（MetaCubeXD）
      - "53:53/tcp" # 内置 DNS（劫持/直连均可用）
      - "53:53/udp"
    volumes:
      - ./data:/data
