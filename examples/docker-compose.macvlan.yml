services:
  mihomo-docker:
    image: ghcr.io/sakana-1314/mihomo:latest
    container_name: mihomo-docker
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      TRANSPARENT_MODE: tproxy
    volumes:
      - ./data:/data
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0
    networks:
      mihomo_gw:
        ipv4_address: 192.168.1.250

networks:
  mihomo_gw:
    external: true
    name: mihomo_gw
