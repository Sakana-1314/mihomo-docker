<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>米哈游 API 加速网关</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth" class="auth">
    <form class="auth-box" id="auth-form">
      <div class="auth-title">米哈游 API 加速网关</div>
      <input id="token-input" type="password" placeholder="访问密钥" autocomplete="current-password">
      <button class="btn primary" type="submit">进入</button>
      <div class="auth-err hidden" id="token-error">密钥不正确</div>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="bar">
      <span class="name">米哈游 API 加速网关</span>
      <span class="pills">
        <span class="pill" id="p-kernel">内核</span>
        <span class="pill" id="p-fw">透明代理</span>
        <span class="pill" id="p-sub">订阅</span>
      </span>
      <span class="spacer"></span>
      <button class="btn" id="btn-refresh">刷新</button>
      <button class="btn" id="btn-key">密钥</button>
    </header>

    <section class="strip">
      <div class="metric"><span class="lbl">下行</span><span class="val" id="t-down-speed">-</span></div>
      <div class="metric"><span class="lbl">上行</span><span class="val" id="t-up-speed">-</span></div>
      <span class="vsep"></span>
      <div class="metric"><span class="lbl">累计下行</span><span class="val dim" id="t-down-total">-</span></div>
      <div class="metric"><span class="lbl">累计上行</span><span class="val dim" id="t-up-total">-</span></div>
      <span class="vsep"></span>
      <div class="metric"><span class="lbl">连接</span><span class="val dim" id="t-conns">-</span></div>
      <div class="metric"><span class="lbl">内存</span><span class="val dim" id="t-memory">-</span></div>
      <span class="vsep"></span>
      <div class="metric"><span class="lbl">模式</span><span class="val dim" id="t-mode">-</span></div>
      <div class="metric"><span class="lbl">IPv6</span><span class="val dim" id="t-ipv6">-</span></div>
    </section>

    <section class="block">
      <header class="block-head">
        <span class="title">订阅</span>
        <span class="spacer"></span>
        <input id="add-name" class="in sm" placeholder="名称">
        <input id="add-url" class="in grow" placeholder="订阅地址">
        <select id="add-type" class="in sm">
          <option value="auto">auto</option>
          <option value="proxies">proxies</option>
          <option value="profile">profile</option>
        </select>
        <button class="btn primary" id="add-submit">添加</button>
        <button class="btn" id="subs-update-all">全部更新</button>
      </header>
      <table class="table" id="subs-table">
        <thead>
          <tr><th>名称</th><th>类型</th><th class="num">节点</th><th>更新时间</th><th>状态</th><th class="right">操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="block">
      <header class="block-head">
        <span class="title">分组</span>
        <select id="group-select" class="in"></select>
        <span class="now" id="group-now"></span>
        <span class="spacer"></span>
        <button class="btn" id="nodes-refresh">刷新</button>
      </header>
      <div class="nodes" id="nodes-grid"></div>
    </section>

    <section class="block">
      <header class="block-head">
        <span class="title">入口</span>
        <span class="spacer"></span>
        <span class="kv"><span class="lbl">密钥</span><code id="secret-text">-</code>
          <button class="btn tiny" id="secret-copy">复制</button></span>
      </header>
      <div class="links">
        <span class="kv"><span class="lbl">本面板</span><a id="panel-link" href="#">-</a></span>
        <span class="kv"><span class="lbl">完整面板</span><a id="dash-link" href="#" target="_blank">-</a></span>
        <span class="kv"><span class="lbl">内核 API</span><code id="api-addr">-</code></span>
      </div>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
